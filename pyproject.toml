[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-puzzle-2-research"
version = "0.1.0"
description = "Reproducible video-forensics research for the public 2018 Crypto Puzzle 2 challenge"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "opencv-python-headless>=4.8", "Pillow>=10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
